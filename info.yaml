# Tiny Tapeout project info
# https://tinytapeout.com

---
project:
  title:        "Adaptive Traffic Light Controller with Emergency Override"
  author:       "Your Name"
  discord:      ""       # optional: your Discord username
  description:  |
    FSM-based two-road traffic light controller with sensor-adaptive
    green-phase extension and hardware emergency-vehicle priority override.
    Implements 7 states: NS_GREEN, NS_YELLOW, EW_GREEN, EW_YELLOW,
    EMRG_HOLD, EMRG_NS, EMRG_EW. Emergency preemption forces all-red
    hold then grants a dedicated green window to the requesting axis.
    Both N/S and E/W emergencies simultaneously detected; N/S has
    priority with E/W serviced on subsequent EMRG_HOLD cycle.
  language:     "Verilog"
  clock_hz:     10000     # 10 kHz default; adjust to match your demo board

# Source files — list all .v files in src/
  source_files:
    - traffic_fsm.v
    - tt_um_traffic_ctrl.v

  top_module:  "tt_um_traffic_ctrl"   # MUST match the module name exactly

# Pin documentation
  inputs:
    - "sensor_ns: vehicle sensor on N/S road (active high)"
    - "sensor_ew: vehicle sensor on E/W road (active high)"
    - "emrg_ns:   emergency vehicle on N/S axis (active high)"
    - "emrg_ew:   emergency vehicle on E/W axis (active high)"
    - "nc"
    - "nc"
    - "nc"
    - "nc"

  outputs:
    - "sig_ns[0]: N/S GREEN  (high = green lit)"
    - "sig_ns[1]: N/S YELLOW (high = yellow lit; both low = red)"
    - "sig_ew[0]: E/W GREEN"
    - "sig_ew[1]: E/W YELLOW"
    - "emrg_active: high during any emergency FSM state"
    - "state[0]: FSM state bit 0 (for 7-segment debug)"
    - "state[1]: FSM state bit 1"
    - "state[2]: FSM state bit 2"

  bidirectional:
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
    - "nc (input)"
